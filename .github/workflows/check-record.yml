# Checks that what the dashboard claims still matches what the Record says.
#
# Warnings only, never a failure. rules/rule-drafting-tools.md says this tooling
# creates no duty, and an amendment is valid whatever docs/data.json happens to
# contain. The point is to tell whoever is amending the Constitution, on the
# pull request making the change, that something else needs updating too —
# rather than letting the dashboard quietly count down to a number nobody voted
# for.

name: Check the Record

on:
  pull_request:
    paths:
      - 'constitution.md'
      - 'docs/**'
      - 'rules/**'
      - 'policies/**'
      - 'votes/**'
      - '.github/workflows/label-proposals.yml'
      # record-vote.yml was absent, so a pull request touching only it ran none
      # of the tests written for it -- which is most of the suite.
      - '.github/workflows/record-vote.yml'
      - '.github/workflows/check-record.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/instrument-templates/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check-record.py

      # The labelling workflow runs on pull_request_target, which GitHub always
      # executes from the default branch — so it cannot be exercised by the pull
      # request that changes it. This runs its logic against a stubbed API
      # instead. Unlike the check above, a failure here is a real failure: it
      # means the workflow would mislabel a proposal.
      - name: Test the labelling workflow's logic
        run: node .github/scripts/test-label-proposals.mjs

      # The arithmetic every vote depends on, against the worked cases in
      # vote-cases.json. A failure here means a vote would be counted wrongly,
      # so unlike the Record check it fails the pull request.
      - name: Test the vote arithmetic
        run: python3 .github/scripts/test-tally.py

      # The dashboard reads a vote file too. Its reader is extracted from
      # index.html rather than copied, so a change to the page that broke the
      # reading would fail here rather than misreport a live vote.
      - name: Test the dashboard's vote reader
        run: node .github/scripts/test-vote-parse.mjs

      # record-vote.yml triggers on `issues`, which GitHub always runs from the
      # default branch, so it cannot be exercised by the pull request that
      # introduces it. This runs its logic against a stubbed API — including a
      # forced write conflict, which is the case that proves a retry reapplies
      # rather than resending stale bytes and erasing another member's row.
      - name: Test the vote-recording workflow's logic
        run: node .github/scripts/test-record-vote.mjs
