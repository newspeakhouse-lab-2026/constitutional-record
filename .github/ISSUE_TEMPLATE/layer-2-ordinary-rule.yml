name: "Layer 2 — Ordinary Rule"
description: A rule for the day-to-day running of the House or the Laboratory, operating within an existing frame.
title: "Ordinary rule: "
labels: ["layer-2", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        **An issue cannot adopt anything.** Only a merged pull request puts text in the Record. Use this when you want to propose something before drafting its text, or to deliberate before committing to wording — then open a pull request carrying the text. If you already have the text, you can skip straight to a pull request; its template asks for everything here.
  - type: markdown
    attributes:
      value: |
        Ordinary Rules cover day-to-day running, the library, communication channels, events, and routine expenses.

        **If your proposal creates or redesigns governance for an area, creates an office, or starts an ongoing financial flow, it is a Layer 3 Policy, not this.** Where two layers are arguable, the more demanding process applies.
  - type: textarea
    id: proposal
    attributes:
      label: The rule
      description: What the rule says. Write it as the text you want adopted, not as a description of it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves.
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Deliberation tier
      description: "A proposal may enter at any tier. One stated objection moves it up a tier; it can never move down."
      options:
        - "Tier A — 48 hours, passes absent a stated objection"
        - "Tier B — a stated period under 7 days, passes absent a stated objection"
        - "Tier C — 7 days or more, simple majority of those voting, quorum 7"
    validations:
      required: true
  - type: textarea
    id: classification
    attributes:
      label: Why this is Layer 2
      description: Required. State the reasoning for the layer, not just the label. Say why it is not Layer 3 or 4.
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Where the file goes
      description: "`policies/{area}/rule-{name}.md` if a policy exists for the area, otherwise `rules/rule-{name}.md`."
      placeholder: "rules/rule-example.md"
    validations:
      required: true
  - type: textarea
    id: observed_by
    attributes:
      label: "Observed by:"
      description: "Required if this creates an enforceable duty — how would fulfilment or breach reasonably become known? This authorises no new surveillance. If it creates no duty, write 'None — creates no enforceable duty'."
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Conflicts with existing instruments
      description: "What you found searching `rules/`, `policies/`, open pull requests, issues and branches. Write 'None found' if there are none, and say what you searched."
    validations:
      required: true
  - type: checkboxes
    id: is_experiment
    attributes:
      label: Time-limited experiment?
      description: "Any proposal may be filed as an experiment, at its own layer. The `exp-` prefix changes the expiry, not the threshold or the process."
      options:
        - label: "This is a time-limited experiment — file it with an `exp-` prefix"
          required: false
  - type: textarea
    id: experiment
    attributes:
      label: Experiment details
      description: "Only if you ticked the box above. Needs all four: **Hypothesis** — what you expect, stated so it could turn out false. **Success criteria** — how the monthly review will tell, and which criterion is decisive if they disagree. **End date** — leave a monthly review before it, so the cohort extends deliberately rather than by accident. **What operates on expiry** — required: an experiment whose expiry breaks the instrument containing it is not an experiment, it is a dependency."
      placeholder: |
        Hypothesis:
        Success criteria:
        End date:
        What operates on expiry:
    validations:
      required: false
